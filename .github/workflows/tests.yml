name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-physics.txt
            requirements-dev.txt

      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check runtime readiness
        run: python eoslab.py doctor

      - name: Run regression suite
        run: python -m pytest -q

      - name: Lint supported post-thesis code
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m ruff check \
            eoslab.py \
            framework/eos_catalog.py \
            framework/eos_sweep.py \
            src/eoslab_runtime.py \
            src/experiment_config.py \
            src/family_workflow.py \
            src/physics/controlled_generation.py \
            src/physics/experiment_reporting.py \
            src/physics/experiment_runner.py \
            src/physics/solve_sequence.py \
            src/utils/logger.py \
            tests
